<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown Timer</title>
  <style>
    body {
      background: #232946;
      color: #fffffe;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      background: #121629;
      padding: 40px 60px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    }
    h1 {
      margin-bottom: 30px;
      font-size: 1.6rem;
      letter-spacing: 1px;
      color: #eebbc3;
    }
    .countdown {
      display: flex;
      justify-content: center;
      gap: 30px;
      font-size: 2.2rem;
      font-weight: bold;
    }
    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 80px;
    }
    .countdown-label {
      font-size: 0.9rem;
      color: #b8c1ec;
      margin-top: 8px;
      font-weight: normal;
      letter-spacing: 1px;
    }
    @media (max-width: 600px) {
      .container {
        padding: 20px 10px;
      }
      .countdown {
        gap: 10px;
        font-size: 1.1rem;
      }
      .countdown-item {
        min-width: 40px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Time until the end of CloudServices Extended Support.</h1>
    <div class="countdown" id="countdown">
      <div class="countdown-item">
        <span id="days">0</span>
        <span class="countdown-label">Days</span>
      </div>
      <div class="countdown-item">
        <span id="hours">00</span>
        <span class="countdown-label">Hours</span>
      </div>
      <div class="countdown-item">
        <span id="minutes">00</span>
        <span class="countdown-label">Minutes</span>
      </div>
      <div class="countdown-item">
        <span id="seconds">00</span>
        <span class="countdown-label">Seconds</span>
      </div>
      <div class="countdown-item">
        <span id="milliseconds">000</span>
        <span class="countdown-label">ms</span>
      </div>
    </div>
  </div>
  <script>
    // Ziel-Datum: 31.03.2027, 00:00:00
    const targetDate = new Date('2027-03-31T00:00:00');

    function pad(num, size) {
      let s = "000" + num;
      return s.substr(s.length - size);
    }

    function updateCountdown() {
      const now = new Date();
      let diff = targetDate - now;

      if (diff < 0) diff = 0;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);
      const milliseconds = Math.floor(diff % 1000);

      document.getElementById('days').textContent = days;
      document.getElementById('hours').textContent = pad(hours, 2);
      document.getElementById('minutes').textContent = pad(minutes, 2);
      document.getElementById('seconds').textContent = pad(seconds, 2);
      document.getElementById('milliseconds').textContent = pad(milliseconds, 3);
    }

    // Update alle 33ms für flüssige Millisekunden-Anzeige
    setInterval(updateCountdown, 33);
    updateCountdown();
  </script>
</body>
</html>
